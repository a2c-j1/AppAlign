name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release.sh "${GITHUB_REF_NAME}"
      - run: gh release create "${GITHUB_REF_NAME}" build/release/*.zip build/release/*.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
